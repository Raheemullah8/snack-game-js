<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Snack Game</title>
</head>
<body>
    
    <main>
        <section>
            <div class="infos">
               <div class="info">
                <h3 >
                 High-Score: 
                 <span id="high-score">0</span>
                </h3>

                
               </div>
               <div class="info">
                 <h3>Score: <span id="score">0</span></h3>

               </div>
               <div class="info">
                <h3>Time : <span id="time">0:00</span></h3>
               </div>
            </div>
            <div class="borders">
              
            </div>
        </section>
        <div class="modal">
           <div class="start-game">
            <h1>welcome to the snack game</h1>
            <button class="btn btn-start">Start Game </button>
           </div>
           
           <div class="game-over">
            <h1>Game Over</h1>
            <button class="btn btn-restart">Restart Game </button>
        </div>
        </div>
        
    </main>
    <script src="script.js"></script>
</body>
</html>
